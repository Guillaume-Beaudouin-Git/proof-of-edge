[project]
name = "proof-of-edge"
version = "0.1.0"
description = "Systematic trading research engine and pre-registered studies: a strategy is guilty until proven innocent."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "skfolio>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
studies = ["yfinance>=0.2.40", "pyarrow>=16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["core", "studies/live_record/tests"]
pythonpath = ["."]
